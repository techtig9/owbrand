name: CI

on:
  push:
    branches: ['**']
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Type-check, lint, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run type-check

      - name: Lint
        run: npm run lint

      # Computes every WCAG 2.2 AA pair across both themes and exits non-zero
      # on a failure. In CI because choosing colours by eye is what leaves the
      # pairs nobody thought to check failing — which is exactly what happened
      # once already, on tertiary text over a raised surface.
      - name: Contrast gate
        run: npm run check:contrast

      - name: Test
        run: npm run test

      # Build-time placeholders only. Real secrets are never needed to compile:
      # every server integration reads its credentials lazily at request time.
      # If this step ever starts needing a real key, that is a regression in the
      # lazy-env rule, not a reason to add a secret here.
      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://ci-placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
          SUPABASE_SERVICE_ROLE_KEY: ci-placeholder-service-role-key
          NEXT_PUBLIC_SITE_URL: https://ci.owbrand.invalid

      - name: Scan the client bundle for secrets
        # After the build, because it inspects .next/static. This is the check
        # that catches a server variable inlined into a client chunk, which
        # nothing in TypeScript, ESLint or the build output reports.
        run: npm run scan:bundle

  database:
    name: Migrations and RLS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Needed only so `npm run` can resolve the script name. The harness
      # itself is bash and psql — no dependency install, which is why this job
      # finishes in well under a minute.
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # The harness boots its own throwaway cluster with initdb rather than
      # using a service container, because the point is to prove the migration
      # chain applies to a genuinely FRESH database in the order a real
      # deployment runs it — a pre-initialised service container would already
      # have skipped that.
      - name: Install PostgreSQL 16 server binaries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends postgresql-16

      # Separate job from `verify` for two reasons: it needs server binaries
      # that most contributors do not have locally (which is why `npm run
      # test:db` is outside `npm run verify`), and a failure here means
      # something different from a unit failure — the schema or an RLS policy,
      # not application logic.
      - name: Apply every migration and run the RLS assertions
        run: npm run test:db
